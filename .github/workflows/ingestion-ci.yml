name: Ingestion CI

on:
    pull_request:
        branches:
            - dev
            - main
        paths:
          - apps/ingestion/**
          - .github/workflows/ingestion-ci.yml
jobs:
    ingestion-validation:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/ingestion
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            
            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: 21
            
            - name: Cache Maven Packages
              uses: actions/cache@v5
              # Keys: If dependencies change, load old cache, maven only downloads missing/changed deps
              with:
                path: ~/.m2/repository
                key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
                restore-keys: ${{ runner.os }}-maven

            - name: Cache SonarQube packages
              uses: actions/cache@v5
              with:
                path: ~/.sonar/cache
                key: ${{ runner.os }}-sonar
                restore-keys: ${{ runner.os }}-sonar

            - name: Make Maven Wrapper Executable
              run: chmod +x mvnw
              
            - name: Lint
              run: ./mvnw checkstyle:check
            
            - name: Build, Unit Test and SonarQube Analysis
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
              run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=CloudSherpa -Dsonar.projectName='CloudSherpa'