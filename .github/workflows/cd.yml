name: CloudSherpa Build and Deploy

on:
    push:
        branches:
            - staging
            - main
        paths:
            - "apps/dashboard/**"
            - "apps/service/**"
            - "apps/ingestion/**"
            - "infra/deployment/**"
            - ".github/workflows/cd.yml"
    pull_request:
        types:
          - opened
          - synchronize
          - reopened
        branches:
            - staging
            - main
        paths:
            - "apps/dashboard/**"
            - "apps/service/**"
            - "apps/ingestion/**"
            - ".github/workflows/cd.yml"

concurrency:
    group: cloudsherpa-${{ github.ref }}
    cancel-in-progress: true

jobs:
    cloudsherpa-build-and-e2e:
      permissions:
        id-token: write
        contents: read
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # Version 7

        - name: Setup Node
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Version 7.0.0
          with:
            node-version: 24
            cache: 'npm'
        
        - name: Configure AWS Credentials
          if: github.event_name == 'push'
          uses: aws-actions/configure-aws-credentials@e004cdcd2873919dbd2e62aa51128bedb3181599 # Version 6.1.0
          with:
            role-to-assume: ${{ vars.AWS_ACTIONS_ECR_ROLE_ARN }}
            aws-region: eu-north-1
        
        - name: Login to Amazon ECR Private
          if: github.event_name == 'push'
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # Version 2.1.6

        - name: Set Image Tags
          run: |
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "INGESTION_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:ingestion-${{ github.sha }}" >> "$GITHUB_ENV"
              echo "SERVICE_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:service-${{ github.sha }}" >> "$GITHUB_ENV"
              echo "DASHBOARD_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:dashboard-${{ github.sha }}" >> "$GITHUB_ENV"
              if [ ${{ github.ref_name }} = 'main' )]; then
                echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_PRODUCTION }}" >> "$GITHUB_ENV"
              else
                echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}" >> "$GITHUB_ENV"
              fi
            else
              echo "INGESTION_IMAGE=cloudsherpa-ingestion:e2e" >> "$GITHUB_ENV"
              echo "SERVICE_IMAGE=cloudsherpa-service:e2e" >> "$GITHUB_ENV"
              echo "DASHBOARD_IMAGE=cloudsherpa-dashboard:e2e" >> "$GITHUB_ENV"
              echo "API_URL=http://localhost:8083" >> "$GITHUB_ENV"
            fi
        
        - name: Build Ingestion
          run: |
            docker build -f apps/ingestion/Dockerfile -t "$INGESTION_IMAGE" .
        
        - name: Build Service
          run: |
            docker build -f apps/service/Dockerfile -t "$SERVICE_IMAGE" .
        
        - name: Build Dashboard
          run: |
            docker build -f apps/dashboard/Dockerfile -t "$DASHBOARD_IMAGE" --build-arg API_URL="$API_URL" apps/dashboard
        
        - name: Set up playwright
          if: github.event_name == 'pull_request'
          working-directory: apps/dashboard
          run: npx playwright install --with-deps

        - name: Compose Up
          if: github.event_name == 'pull_request'
          run: |
            docker compose -f infra/docker-compose.e2e.yml up -d

        - name: Playwright E2E tests
          if: github.event_name == 'pull_request'
          working-directory: apps/dashboard
          run: |
            npm run test:e2e:ci
        
        - name: Compose Down
          if: github.event_name == 'pull_request' && always()
          run: |
            docker compose -f infra/docker-compose.e2e.yml down
          
        - name: Push Ingestion Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push $INGESTION_IMAGE"

        - name: Push Service Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push $SERVICE_IMAGE

        - name: Push Dashboard Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push "$DASHBOARD_IMAGE"


    cloudsherpa-deploy:
        if: github.event_name == 'push'
        needs: cloudsherpa-build-and-e2e
        permissions:
            id-token: write
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # Version 7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e004cdcd2873919dbd2e62aa51128bedb3181599 # Version 6.1.0
              with:
                role-to-assume: ${{ vars.AWS_ACTIONS_DEPLOY_ROLE_ARN }}
                aws-region: eu-north-1

            - name: Deploy via AWS SSM
              env:
                IMAGE_TAG: ${{ github.sha }}
                INSTANCE_ID: ${{ github.ref_name == 'main' && vars.AWS_DEPLOY_PRODUCTION_INSTANCE_ID || vars.AWS_DEPLOY_STAGING_INSTANCE_ID }}
              run: |
                COMMAND_ID="$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy commit $IMAGE_TAG" \
                    --parameters "commands=[\"/opt/CloudSherpa/deploy.sh '$IMAGE_TAG'\"]" \
                    --query "Command.CommandId" \
                    --output text
                )"

                aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
