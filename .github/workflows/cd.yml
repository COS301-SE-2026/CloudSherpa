name: CloudSherpa Build and Deploy

on:
    push:
        branches:
            - staging
            - main
        paths:
            - "apps/dashboard/**"
            - "apps/service/**"
            - "apps/ingestion/**"
            - "infra/deployment/**"
            - ".github/workflows/cd.yml"
    pull_request:
        types:
          - opened
          - synchronize
          - reopened
        branches:
            - staging
            - main
        paths:
            - "apps/dashboard/**"
            - "apps/service/**"
            - "apps/ingestion/**"
            - "apps/intelligence/**"
            - ".github/workflows/cd.yml"

concurrency:
    group: cloudsherpa-${{ github.ref }}
    cancel-in-progress: true

jobs:
    cloudsherpa-build-e2e-performance:
      permissions:
        id-token: write
        contents: read
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # Version 7

        - name: Setup Node
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Version 7.0.0
          with:
            node-version: 24
            cache: 'npm'
            cache-dependency-path: apps/dashboard/package-lock.json

        
        - name: Configure AWS Credentials
          if: github.event_name == 'push'
          uses: aws-actions/configure-aws-credentials@e004cdcd2873919dbd2e62aa51128bedb3181599 # Version 6.1.0
          with:
            role-to-assume: ${{ vars.AWS_ACTIONS_ECR_ROLE_ARN }}
            aws-region: eu-north-1
        
        - name: Login to Amazon ECR Private
          if: github.event_name == 'push'
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # Version 2.1.6

        - name: Set Image Tags
          run: |
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "INGESTION_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:ingestion-${{ github.sha }}" >> "$GITHUB_ENV"
              echo "SERVICE_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:service-${{ github.sha }}" >> "$GITHUB_ENV"
              echo "DASHBOARD_IMAGE=${{ steps.login-ecr.outputs.registry }}/cloudsherpa:dashboard-${{ github.sha }}" >> "$GITHUB_ENV"
              if [ ${{ github.ref_name }} = "main" ]; then
                echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_PRODUCTION }}" >> "$GITHUB_ENV"
              else
                echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}" >> "$GITHUB_ENV"
              fi
            else
              echo "INGESTION_IMAGE=cloudsherpa-ingestion:e2e" >> "$GITHUB_ENV"
              echo "SERVICE_IMAGE=cloudsherpa-service:e2e" >> "$GITHUB_ENV"
              echo "DASHBOARD_IMAGE=cloudsherpa-dashboard:e2e" >> "$GITHUB_ENV"
              echo "INTELLIGENCE_IMAGE=intelligence:e2e" >> "$GITHUB_ENV"
              echo "API_URL=http://localhost:8083" >> "$GITHUB_ENV"
            fi
        
        - name: Build Ingestion
          run: |
            docker build -f apps/ingestion/Dockerfile -t "$INGESTION_IMAGE" .
        
        - name: Build Service
          run: |
            docker build -f apps/service/Dockerfile -t "$SERVICE_IMAGE" .
        
        - name: Build Dashboard
          run: |
            docker build -f apps/dashboard/Dockerfile -t "$DASHBOARD_IMAGE" --build-arg API_URL="$API_URL" apps/dashboard
        
        - name: Build Intelligence
          if: github.event_name == 'pull_request'
          run: |
            docker build -f apps/intelligence/Dockerfile -t "$INTELLIGENCE_IMAGE" apps/intelligence

        - name: Install dashboard dependencies
          if: github.event_name == 'pull_request'
          working-directory: apps/dashboard
          run: npm ci --ignore-scripts

        - name: Install psql
          if: github.event_name == 'pull_request'
          run: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client
        
        - name: Setup k6 CLI
          if: github.event_name == 'pull_request'
          uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
          
        - name: Set up playwright
          if: false
          working-directory: apps/dashboard
          run: npm run playwright:install

        - name: Compose Up
          if: github.event_name == 'pull_request'
          run: |
            docker compose -f infra/docker-compose.e2e.yml up -d --wait

        - name: Playwright E2E tests
          if: false
          working-directory: apps/dashboard
          run: |
            npm run test:e2e
        
        - name: DB seed for NFR tests
          if: github.event_name == 'pull_request'
          env:
            DUMMY_PASS: mock_pass
          run: |
            psql "postgresql://cloudsherpa:${DUMMY_PASS}@localhost:5432/sherpadb" \
              -a \
              -f nfr-tests/common/seed/common.sql \
              -f nfr-tests/common/seed/nfr-user.sql \
              -f nfr-tests/common/seed/historical-metric-seed.sql \
              -f nfr-tests/common/seed/normalized-costs-seed.sql

            psql "postgresql://cloudsherpa:${DUMMY_PASS}@localhost:5432/sherpadb" \
              -c "SELECT seed_normalized_metrics(); SELECT seed_normalized_costs();"
        
        - name: Run Historical Metric Fetch Load Test
          if: github.event_name == 'pull_request'
          uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158
          env:
            BASE_URL: http://localhost:8083
          with:
            path: |
              nfr-tests/historical-metric-load.js

        - name: Run Billing Forecasting Load Test
          if: github.event_name == 'pull_request'
          uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158
          env:
            BASE_URL: http://localhost:8083
          with:
            path: |
              nfr-tests/forecasting/billing-forecasting-load.js

        - name: Compose Down
          if: github.event_name == 'pull_request' && always()
          run: |
            docker compose -f infra/docker-compose.e2e.yml down
          
        - name: Push Ingestion Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push "$INGESTION_IMAGE"

        - name: Push Service Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push "$SERVICE_IMAGE"

        - name: Push Dashboard Image
          if: github.event_name == 'push'
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: cloudsherpa
          run: |
            docker push "$DASHBOARD_IMAGE"


    cloudsherpa-deploy:
        if: github.event_name == 'push'
        needs: cloudsherpa-build-e2e-performance
        permissions:
            id-token: write
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # Version 7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e004cdcd2873919dbd2e62aa51128bedb3181599 # Version 6.1.0
              with:
                role-to-assume: ${{ vars.AWS_ACTIONS_DEPLOY_ROLE_ARN }}
                aws-region: eu-north-1

            - name: Deploy via AWS SSM
              env:
                IMAGE_TAG: ${{ github.sha }}
                INSTANCE_ID: ${{ github.ref_name == 'main' && vars.AWS_DEPLOY_PRODUCTION_INSTANCE_ID || vars.AWS_DEPLOY_STAGING_INSTANCE_ID }}
              run: |
                COMMAND_ID="$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy commit $IMAGE_TAG" \
                    --parameters "commands=[\"/opt/CloudSherpa/deploy.sh '$IMAGE_TAG'\"]" \
                    --query "Command.CommandId" \
                    --output text
                )"

                failure_statusses=("Cancelled" "TimedOut" "Failed" "Cancelling")

                MAX_RETRIES=40
                current_retries=0

                while (( current_retries < MAX_RETRIES )); do
                  
                  if ! STATUS="$(aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "Status" \
                    --output text
                    )"; then
                    echo "get-command-invocation failed, setting status to PENDING"
                    STATUS="Pending"
                  fi
                  
                  if [[ "$STATUS" == "Success" ]]; then
                    echo "Deployment script command ran successfully"
                    exit 0
                  fi

                  for failure_status in "${failure_statusses[@]}"; do
                    if [[ "$STATUS" == "$failure_status" ]]; then
                      echo "Deployment script command failed with status ${STATUS}"
                      exit 1
                    fi
                  done

                  echo "Current status: ${STATUS}"

                  current_retries=$((current_retries + 1))
                  sleep 30
                done

                echo "Failed after ${MAX_RETRIES} retries exceeded with status ${STATUS}"
                exit 1
