name: CloudSherpa Dashboard CI

on:
    pull_request:
        types:
          - opened
          - synchronize
          - reopened
        branches:
            - dev
            - main
        paths:
            - apps/dashboard/**
            - .github/workflows/dashboard-ci.yml

jobs:
    dashboard-validate:
        runs-on: ubuntu-latest

        permissions:
          contents: read
          pull-requests: write
          checks: write

        defaults:
            run:
                working-directory: apps/dashboard
        
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'
                cache-dependency-path: apps/dashboard/package-lock.json

            - name: Install Dependencies
              run: npm ci --prefer-offline
            
            - name: Lint
              run: npm run lint
            
            - name: Test
              run: npm run test

            - name: Build
              run: npm run build
            
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8
              with:
                projectBaseDir: apps/dashboard
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}