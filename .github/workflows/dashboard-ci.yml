name: CloudSherpa Dashboard CI

on:
    pull_request:
        branches:
            - dev
            - main
        paths:
            - apps/dashboard/**
            
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
    build-lint-test-dashboard:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: apps/dashboard
        
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm
                cache-dependency-path: apps/dashboard/package-lock.json

            - name: Install Dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint
            
            # Still need to config tests
            # - name: Test
            #   run: npm test

            - name: Build
              run: npm run build
            
            - name: Archive build
              uses: actions/upload-artifact@v4
              with:
                name: dashboard-build
                path: |
                    apps/dashboard/.next
                    apps/dashboard/package.json
                    apps/dashboard/package-lock.json
                    apps/dashboard/public
    lighthouseci:
        runs-on: ubuntu-latest
        needs: build-lint-test-dashboard
        defaults:
            run:
                working-directory: apps/dashboard

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Download Dashboard Build
              uses: actions/download-artifact@v4
              with:
                name: dashboard-build
                path: apps/dashboard
        
            - name: Setup Chrome
              uses: browser-actions/setup-chrome@v2
              with:
                  install-dependencies: true

            - name: Install Production Dependencies
              run: npm ci --omit=dev

            - name: Start Dashboard
              run: npx next start

            - name: Wait for Dashboard
              run: npx wait-on http://localhost:3000    

            - name: Run Lighthouse CI
              run: npx lhci autorun --collect.settings.chromeFlags="--no-sandbox"
              env:
                  LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
