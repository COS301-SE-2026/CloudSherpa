name: Dashboard CI triggered on edit

on:
    pull_request:
        types:
            - edited
        paths:
            - apps/dashboard/**
            - .github/workflows/dashboard-ci.yml
            - .github/workflows/dashboard-ci-edit.yml

jobs:
    dashboard-validation-on-edit:
        if: github.event.changes.base != null && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'main')
        uses: ./.github/workflows/dashboard-ci.yml
        secrets: inherit
