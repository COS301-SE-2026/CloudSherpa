spring.application.name=service
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sherpadb}
spring.datasource.username=${POSTGRES_USER:cloudsherpa}
spring.datasource.password=${POSTGRES_PASSWORD:mock_pass}
auth.jwt.secret=${AUTH_JWT_SECRET:mock_secret}
auth.jwt.exp-minutes=${AUTH_JWT_EXP_MINUTES:60}