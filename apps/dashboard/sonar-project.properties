sonar.projectKey=CloudSherpa-dashboard
sonar.projectName=CloudSherpa Dashboard

sonar.sources=app,components,design_system,hooks,lib,services,stores,types
sonar.tests=__tests__

sonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx,__tests__/**/*.spec.ts,__tests__/**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/playwright-report/**,**/test-results/**,next-env.d.ts,**/*.tsbuildinfo,**/*.sync-conflict-*

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8
