services:
  # TODO: add explicit container names 
  ingestion:
    build:
      context: ../apps/ingestion
      dockerfile: Dockerfile
      target: prod
    image: cloudsherpa-ingestion:prod
    container_name: ingestion
    ports:
      - "8081:8080"
    env_file:
      - ../apps/ingestion/.env
    depends_on:
      sherpa-db:
        condition: service_healthy
    
  service:
    build:
      context: ../apps/service
      dockerfile: Dockerfile
      target: prod
    image: cloudsherpa-service:prod
    container_name: service
    ports:
      - "8083:8080"
    env_file:
      - ../apps/service/.env
    depends_on:
      sherpa-db:
        condition: service_healthy
  
  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
      target: prod
    image: cloudsherpa-dashboard:prod
    container_name: dashboard
    ports:
      - "3000:3000"
    env_file:
      - ../apps/dashboard/.env

  sherpa-db:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: sherpa-db
    restart: unless-stopped
    env_file:
      - ../persistence/sherpadb/.env
    ports:
      - "5432:5432"
    volumes:
      - sherpa_db_data:/var/lib/postgresql/data
      - ../persistence/sherpadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sherpa_db_data: 
  # Ensures that the data is persistent across docker compose down / up 