services:
  ingestion:
    build:
      context: ..
      dockerfile: apps/ingestion/Dockerfile
      target: prod
    image: grard835/cloudsherpa-ingestion:prod
    container_name: ingestion
    ports:
      - "8080"
    env_file:
      - ../apps/ingestion/.env
    depends_on:
      sherpa-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  service:
    build:
      context: ../
      dockerfile: apps/service/Dockerfile
      target: prod
    image: grard835/cloudsherpa-service:prod
    container_name: service
    ports:
      - "8083:8080"
    env_file:
      - ../apps/service/.env
    depends_on:
      sherpa-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
      target: prod
    image: grard835/cloudsherpa-dashboard:prod
    container_name: dashboard
    ports:
      - "3000:3000"
    env_file:
      - ../apps/dashboard/.env
    depends_on:
      service:
        condition: service_healthy

  sherpa-db:
    image: timescale/timescaledb-ha:pg16-ts2.29
    container_name: sherpa-db
    restart: unless-stopped
    env_file:
      - ../persistence/sherpadb/.env
    volumes:
      - sherpa_db_data:/home/postgres/pgdata/data
      - ../persistence/sherpadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    env_file:
      - ../persistence/sherpadb/.env
    depends_on:
      - sherpa-db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  sherpa_db_data: 
  pgadmin_data:
  # Ensures that the data is persistent across docker compose down / up 