<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iconography · CloudSherpa Design System</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="mobileFriendly.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    .icon-cell { display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 16px;background:var(--bg-card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:default;transition:background 0.15s; }
    .icon-cell:hover { background:var(--bg-mid); }
    .icon-cell:hover .icon-el { color:#2f2fe4; }
    .icon-cell:hover .icon-name { color:#2f2fe4; }
    .icon-el { color:var(--text-muted);transition:color 0.15s; }
    .icon-name { font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);text-align:center;transition:color 0.15s; }
  </style>

</head>
<body>
  <div id="nav-mount"></div>

  <div class="page-wrap">
    <div class="page-header">
      <h1 class="page-title">Iconography</h1>
      <p class="page-sub">Lucide · 20px </p>
    </div>

    <div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;">
      <div style="display:grid;grid-template-columns:repeat(5,1fr);" id="icon-grid">

        <div class="icon-cell" data-desc="Dark mode toggle. Distinct crescent stays readable at all sizes.">
          <i data-lucide="moon" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">moon</span>
        </div>

        <div class="icon-cell" data-desc="Light mode toggle. Bold rays communicate brightness.">
          <i data-lucide="sun" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">sun</span>
        </div>

        <div class="icon-cell" data-desc="Overview screens. Grid pattern represents multi-source data aggregation.">
          <i data-lucide="layout-dashboard" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">layout-dashboard</span>
        </div>

        <div class="icon-cell" data-desc="Cloud resource marker. Represents any hosted infrastructure or service.">
          <i data-lucide="cloud" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">cloud</span>
        </div>

        <div class="icon-cell" data-desc="Inline edit trigger. Angled form implies action and mutability.">
          <i data-lucide="pencil" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">pencil</span>
        </div>

        <div class="icon-cell" data-desc="Date pickers and scheduling. Clean grid avoids visual noise.">
          <i data-lucide="calendar" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">calendar</span>
        </div>

        <div class="icon-cell" data-desc="Expand detail panes to reveal metadata without leaving the page.">
          <i data-lucide="panel-right-open" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">panel-right-open</span>
        </div>

        <div class="icon-cell" data-desc="Collapse auxiliary panes to maximize the primary data workspace.">
          <i data-lucide="panel-right-close" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">panel-right-close</span>
        </div>

        <div class="icon-cell" data-desc="Visibility on. Open iris signals the shown state for sensitive values.">
          <i data-lucide="eye" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">eye</span>
        </div>

        <div class="icon-cell" data-desc="Visibility off. Strike-through signals masked state for credentials.">
          <i data-lucide="eye-off" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">eye-off</span>
        </div>

        <div class="icon-cell" style="border-bottom:none;" data-desc="Disclosure and dropdown triggers. Universal cue for expandable content.">
          <i data-lucide="chevron-down" class="icon-el" style="width:20px;height:20px;"></i>
          <span class="icon-name">chevron-down</span>
        </div>

      </div>
      <div style="padding:12px 20px;background:var(--bg-mid);min-height:44px;border-top:1px solid var(--border);display:flex;align-items:center;">
        <p id="icon-desc" style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-secondary);transition:opacity 0.15s;opacity:0;">Hover an icon to see its usage.</p>
      </div>
    </div>
  </div>

  <script src="navBar.js"></script>

  <script>
    renderingNavBar('Iconography');
    lucide.createIcons();

    const desc = document.getElementById('icon-desc');
    
    document.querySelectorAll('.icon-cell').forEach(cell => {
      cell.addEventListener('mouseenter', () => {
        desc.textContent = cell.dataset.desc || '';
        desc.style.opacity = '1';
      });
      cell.addEventListener('mouseleave', () => { desc.style.opacity = '0'; });
    });
    
  </script>
</body>
</html>
