<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudSherpa · Design System</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="mobileFriendly.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-logo{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 52px);
      text-align: center;
      padding: 40px 20px;
    }

    .logo-image{
      max-width: 90%;
      max-height: 60vh;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .design-system-label{
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--blue);
      margin-bottom: 24px;
    }

    .tagline{
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-top: 0;
    }

    @media (max-width: 680px){
      .logo-image {
        max-width: 80%;
        max-height: 50vh;
      }
      .design-system-label {
        font-size: 10px;
      }
      .tagline {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  
  <div class="hero-logo">

    <p class="design-system-label">DESIGN SYSTEM</p>
    <img src="CloudSherpaLogo.png" alt="CloudSherpa" class="logo-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
    <p class="tagline">trusted guardrails for the journey to cloud-native</p>

  </div>

  <script src="navBar.js"></script>

  <script>

    if(typeof renderingNavBar === 'function'){
      renderingNavBar('Home');
    }
    
  </script>
  
</body>
</html>
